{% extends 'base.html' %}

{% block content %}
<section class="hero-card login-layout">
  <div class="hero-copy">
    <p class="eyebrow">Acceso seguro</p>
    <h2>Firma tu entrada con tu nombre</h2>
    <p>
      Si alguien intenta saltarse el acceso escribiendo la URL del panel, el sistema lo regresará al inicio.
    </p>
  </div>

  <form class="panel form-stack" method="post" action="{{ url_for('login') }}">
    <label for="nutri_name">Nombre del nutriólogo</label>
    <input id="nutri_name" name="nutri_name" type="text" placeholder="Ej. Dra. Laura Pérez" autocomplete="name" required>
    <button type="submit">Entrar al sistema</button>
  </form>
</section>
{% endblock %}
